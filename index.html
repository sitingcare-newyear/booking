<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>線上預約</title>
<script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Huninn&family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#F4EEE4;--card:#FBF8F2;--ink:#4E3F36;--mute:#9A8A7E;--line:#E7DCCF;--main:#B4532A;--main2:#D77B3F;--soft:#F6E4D4;--bad:#B4432E;--ok:#6E8F5C}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{margin:0;min-height:100vh;color:var(--ink);font-family:"Huninn","Zen Maru Gothic",-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif;font-size:16px;
background-color:var(--bg);
background-image:radial-gradient(circle at 50% 100%,transparent 18px,rgba(180,140,110,.10) 19px,transparent 20px,transparent 26px,rgba(180,140,110,.08) 27px,transparent 28px);
background-size:56px 28px}
.brand{background:linear-gradient(180deg,#D98A4E,#C96B34);color:#fff;padding:18px 16px 26px;text-align:center;border-radius:0 0 28px 28px;box-shadow:0 4px 14px rgba(150,80,40,.18)}
.brand img{width:68px;height:68px;border-radius:50%;border:3px solid rgba(255,255,255,.85);display:block;margin:0 auto 8px}
.brand .t1{font-size:19px;font-weight:900;letter-spacing:4px}
.brand .t2{font-size:12px;letter-spacing:2px;opacity:.9;margin-top:2px}
.wrap{max-width:520px;margin:0 auto;padding:16px 14px 48px}
h1{font-size:22px;font-weight:900;margin:6px 4px 12px;color:var(--main);letter-spacing:3px;text-align:center}
.hello{color:var(--mute);font-size:14px;margin:0 4px 12px;text-align:center;letter-spacing:2px}
.tabs{display:flex;background:#EBDFD2;border-radius:999px;padding:5px;margin-bottom:16px}
.tab{flex:1;text-align:center;padding:10px;border-radius:999px;cursor:pointer;font-weight:700;color:#8C6F5E;letter-spacing:2px}
.tab.on{background:var(--main);color:#fff;box-shadow:0 2px 8px rgba(180,83,42,.3)}
.card{background:var(--card);border:6px solid #EADFD3;border-radius:22px;padding:16px;margin-bottom:16px;overflow:hidden}
.step{margin:-16px -16px 14px;padding:11px 16px;background:var(--main);color:#fff;font-weight:900;font-size:16px;letter-spacing:3px;display:flex;align-items:center;justify-content:center;gap:10px}
.step .n{width:26px;height:26px;border-radius:50%;background:#fff;color:var(--main);display:inline-flex;align-items:center;justify-content:center;font-size:14px;letter-spacing:0}
.chips{display:flex;flex-wrap:wrap;gap:10px}
.chip{padding:10px 16px;border:2px solid var(--line);border-radius:999px;background:#fff;cursor:pointer;font-size:15px;font-weight:700;color:var(--ink);letter-spacing:1px}
.chip.on{background:var(--main);color:#fff;border-color:var(--main);box-shadow:0 2px 8px rgba(180,83,42,.25)}
.seg{display:flex;gap:12px}
.seg .chip{flex:1;text-align:center;padding:16px 8px;border-radius:20px;font-size:17px;letter-spacing:3px}
.seg .chip svg{width:34px;height:34px;display:block;margin:0 auto 6px}
.seg .chip small{display:block;font-size:12px;opacity:.8;margin-top:2px;letter-spacing:1px;font-weight:500}
label{display:block;font-size:13px;color:var(--mute);margin:14px 0 6px;font-weight:700;letter-spacing:1px}
input,select,textarea{width:100%;padding:12px 14px;border:2px solid var(--line);border-radius:14px;font-size:16px;background:#fff;font-family:inherit;color:var(--ink);outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--main2)}
.btn{display:block;width:100%;padding:15px;border:none;border-radius:999px;background:var(--main);color:#fff;font-size:17px;font-weight:900;letter-spacing:4px;margin-top:18px;cursor:pointer;font-family:inherit;box-shadow:0 3px 10px rgba(180,83,42,.3)}
.btn.ghost{background:var(--soft);color:var(--main);box-shadow:none}
.btn.bad{background:#F5DCD3;color:var(--bad);box-shadow:none}
.btn:disabled{opacity:.5}
.mute{color:var(--mute);font-size:14px}
.note{background:var(--soft);color:var(--main);border-radius:14px;padding:10px 14px;font-size:14px;margin-bottom:14px;font-weight:500;text-align:center}
.big{font-size:34px;letter-spacing:6px;font-weight:900;color:var(--main);text-align:center;margin:6px 0 10px;background:var(--soft);border-radius:16px;padding:10px 0}
.kv{display:flex;justify-content:space-between;padding:10px 2px;border-bottom:1px dashed var(--line);gap:12px}
.kv:last-child{border:none}
.kv span:first-child{color:var(--mute);font-weight:700;flex:none}
.kv span:last-child{text-align:right;font-weight:500}
.center{text-align:center;padding:40px 0}
.shot{text-align:center;background:var(--main);color:#fff;border-radius:999px;padding:8px;font-weight:900;letter-spacing:3px;margin-bottom:12px}
.when{text-align:center;margin:4px 0 8px}
.when .wd{color:var(--main);font-size:18px;font-weight:900;letter-spacing:2px}
.when .wt{font-size:30px;font-weight:900;letter-spacing:2px}
.remind{white-space:normal;word-break:keep-all;background:#fff;border:2px dashed var(--main2);border-radius:16px;padding:12px 14px;margin-top:14px;font-size:14px;line-height:1.7;text-align:center;color:var(--ink)}
.lnk{color:var(--main);font-size:13px;margin-left:6px}
a.btn{text-align:center;text-decoration:none;box-sizing:border-box}
.btn.line{background:#06C755;box-shadow:0 3px 10px rgba(6,199,85,.3)}
.foot{text-align:center;color:var(--mute);font-size:12px;letter-spacing:2px;margin-top:8px}
#toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%);background:#4E3F36;color:#fff;padding:12px 20px;border-radius:999px;display:none;z-index:20;max-width:90%;text-align:center;font-size:15px}
</style>
</head>

const S={mode:'guest',idToken:'',name:'',cfg:null,tab:'book',sel:{},dates:null,times:null,loading:'',mine:null,guestQ:null};

function $(id){return document.getElementById(id);}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function toast(m){const t=$('toast');t.textContent=m;t.style.display='block';clearTimeout(t._h);t._h=setTimeout(()=>t.style.display='none',3000);}
async function call(action,data){
  const body=Object.assign({action},data||{});
  if(S.mode==='line'&&S.idToken)body.idToken=S.idToken;
  const res=await fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(body)});
  const j=await res.json();
  if(!j.ok){
    if(S.mode==='line'&&j.error.indexOf('登入已過期')>=0){
      toGuest();
      if(action==='book')return call(action,data);
      render();
      throw new Error('LINE 登入失效 已切換成手機預約模式');
    }
    throw new Error(j.error);
  }
  return j.data;
}
function normPhone(v){
  let s=String(v||'').replace(/[０-９]/g,c=>String.fromCharCode(c.charCodeAt(0)-65248)).replace(/\D/g,'');
  if(/^8869\d{8}$/.test(s))s='0'+s.slice(3);
  return s;
}
function phoneHint(v){
  const s=normPhone(v);
  if(!s)return {ok:false,msg:''};
  if(!/^0/.test(s)||(s.length>=2&&!/^09/.test(s)))return {ok:false,msg:'手機號碼要 09 開頭'};
  if(s.length<10)return {ok:false,msg:'還差 '+(10-s.length)+' 碼'};
  if(s.length>10)return {ok:false,msg:'號碼多了 '+(s.length-10)+' 碼'};
  return {ok:true,msg:'格式正確'};
}
function attachPhone(id){
  const el=$(id);if(!el)return;
  let tip=$(id+'_tip');
  if(!tip){tip=document.createElement('div');tip.id=id+'_tip';tip.style.cssText='font-size:13px;margin-top:4px;min-height:18px';el.insertAdjacentElement('afterend',tip);}
  const upd=()=>{const h=phoneHint(el.value);tip.textContent=h.msg;tip.style.color=h.ok?'#5f8f6e':'var(--bad)';el.style.borderColor=el.value?(h.ok?'#5f8f6e':'var(--bad)'):'';};
  el.addEventListener('input',upd);
  el.addEventListener('blur',()=>{const s=normPhone(el.value);if(/^09\d{8}$/.test(s))el.value=s;upd();});
  if(el.value)upd();
}
function toGuest(){S.mode='guest';S.idToken='';S.loginFailed=true;S.mine=null;}
function flag(k,v){try{if(v===undefined)return sessionStorage.getItem(k);sessionStorage.setItem(k,v);}catch(e){return null;}}
function withTimeout(p,ms){return Promise.race([p,new Promise((_,rej)=>setTimeout(()=>rej(new Error('timeout')),ms))]);}

let initP=null;
function prefetchInit(){if(!initP)initP=call('init').catch(e=>{initP=null;throw e;});return initP;}
async function boot(){
  prefetchInit();
  if(params.get('guest')){S.mode='guest';return start();}
  try{
    if(typeof liff==='undefined')throw new Error('no sdk');
    await withTimeout(liff.init({liffId:LIFF_ID}),8000);
    if(!liff.isLoggedIn()){
      if(liff.isInClient()&&!flag('triedLogin')){flag('triedLogin','1');liff.login({redirectUri:location.href});return;}
      if(liff.isInClient())throw new Error('login failed');
      return renderLoginChoice();
    }
    S.idToken=liff.getIDToken()||'';
    if(!S.idToken)throw new Error('no token');
    S.mode='line';
    try{const p=await liff.getProfile();S.name=p.displayName||'';}catch(e){}
  }catch(e){
    if(params.get('bind'))return renderMsg('請用手機 LINE 打開這個連結');
    S.mode='guest';S.loginFailed=true;
  }
  if(params.get('bind'))return renderBind();
  await start();
}

function renderLoginChoice(){
  $('app').innerHTML=`<div class="card">
  <div class="mute">用 LINE 登入可以收到預約通知 也能直接查詢自己的預約</div>
  <button class="btn" id="goLine">用 LINE 登入</button>
  <button class="btn ghost" id="goGuest">不登入 用手機預約</button></div>`;
  $('goLine').onclick=()=>liff.login({redirectUri:location.href});
  $('goGuest').onclick=()=>{S.mode='guest';start();};
}

function renderMsg(m){$('app').innerHTML=`<div class="card center">${esc(m)}</div>`;}

async function start(){
  renderMsg('載入中');
  try{S.cfg=await prefetchInit();}catch(e){return renderMsg('系統暫時無法使用 請稍後再試');}
  render();
}

function render(){
  const c=S.cfg;
  let h=`<div class="hello">${S.mode==='line'?(S.name?esc(S.name)+' 你好':'已用 LINE 登入'):'訪客模式'}</div>`;
  if(S.loginFailed)h+=`<div class="note">LINE 登入暫時無法使用 你可以直接用手機預約 完成後請記下預約碼</div>`;
  h+=`<div class="tabs"><div class="tab ${S.tab==='book'?'on':''}" data-tab="book">我要預約</div><div class="tab ${S.tab==='mine'?'on':''}" data-tab="mine">我的預約</div></div>`;
  if(S.tab==='book')h+=c.opensOn?`<div class="card center">預約將於 ${esc(c.opensOn)} 開放<br><span class="mute">敬請期待</span></div>`:bookHtml();
  else h+=mineHtml();
  if(S.mode==='line')h+=`<div class="mute" style="text-align:center;margin-top:20px"><a href="#" id="useGuest" style="color:var(--mute)">LINE 登入有問題嗎 改用手機預約</a></div>`;
  $('app').innerHTML=h;
  if($('useGuest'))$('useGuest').onclick=e=>{e.preventDefault();toGuest();S.loginFailed=false;render();};
  document.querySelectorAll('[data-tab]').forEach(el=>el.onclick=()=>{S.tab=el.dataset.tab;if(S.tab==='mine'&&S.mode==='line')loadMine();else render();});
  bindBook();bindMine();
}

  let h=`<div class="card"><div class="step"><span class="n">1</span>選擇服務方式</div><div class="seg">
  <div class="chip ${s.type==='門市'?'on':''}" data-type="門市"><svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linejoin="round"><path d="M24 43s14-13 14-24a14 14 0 0 0-28 0c0 11 14 24 14 24z"/><circle cx="24" cy="19" r="5"/></svg>門市<small>${c.dur['門市']} 分鐘</small></div>
  ${hasHome?`<div class="chip ${s.type==='到府'?'on':''}" data-type="到府"><svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linejoin="round"><path d="M6 22 24 7l18 15"/><path d="M11 19v21h26V19"/><path d="M20 40V28h8v12"/></svg>到府<small>${c.dur['到府']} 分鐘</small></div>`:''}
  </div></div>`;
  if(s.type==='門市'){
    h+=`<div class="card" id="sec2"><div class="step"><span class="n">2</span>選擇館別</div><div class="chips">${c.locations.map(l=>`<div class="chip ${s.location===l.name?'on':''}" data-loc="${esc(l.name)}">${esc(l.name)}</div>`).join('')}</div>
    ${s.location?(()=>{const l=c.locations.find(x=>x.name===s.location);if(!l||(!l.address&&!l.map))return '';return `<div class="mute" style="margin-top:8px">${esc(l.address||'')}${l.map?` <a href="${esc(l.map)}" target="_blank" style="color:var(--main)">查看地圖</a>`:''}</div>`;})():''}</div>`;
  }
  if(s.type==='到府'){
    h+=`<div class="card" id="sec2"><div class="step"><span class="n">2</span>選擇服務區域</div>
    <div class="note">到府服務需另加車馬費 車馬費可以在 LINE 預約圖文選單的「居家服務區域」查看</div>
    ${(()=>{const regs=availRegions(c);if(!regs.length)return '<div class="mute">目前還沒有開放到府服務的區域</div>';
      let x=`<div class="chips" style="justify-content:center">${regs.map(r=>`<div class="chip ${s.region===r.name?'on':''}" data-rg="${r.name}">${r.name}</div>`).join('')}</div>`;
      const reg=regs.find(r=>r.name===s.region);
      if(reg)x+=`<label style="text-align:center">選擇行政區</label><div class="chips" style="justify-content:center">${reg.items.map(it=>`<div class="chip ${s.county===it[0]&&s.district===it[1]?'on':''}" data-ac="${it[0]}" data-ad="${it[1]}">${it[1]}</div>`).join('')}</div>`;
      return x;})()}
    <div class="mute" style="margin-top:10px;text-align:center">找不到你的區域 代表目前還沒開放到府服務</div></div>`;
  }
  if(placeReady()){
    h+=`<div class="card" id="sec3"><div class="step"><span class="n">3</span>選擇日期</div>`;
    if(S.loading==='dates')h+=`<div class="mute">查詢中</div>`;
    else if(!S.dates||!S.dates.length)h+=`<div class="mute">目前沒有可預約的日期</div>`;
    else h+=`<div class="chips">${S.dates.map(d=>`<div class="chip ${s.date===d.date?'on':''}" data-date="${d.date}">${esc(d.label)}</div>`).join('')}</div>`;
    h+=`</div>`;
  }
  if(s.date){
    h+=`<div class="card" id="sec4"><div class="step"><span class="n">4</span>選擇時段</div>`;
    if(S.loading==='times')h+=`<div class="mute">查詢中</div>`;
    else if(!S.times||!S.times.length)h+=`<div class="mute">這天已經約滿了 請換一天</div>`;
    else h+=`<div class="chips">${S.times.map(t=>`<div class="chip ${s.time===t?'on':''}" data-time="${t}">${t}</div>`).join('')}</div>`;
    h+=`</div>`;
  }
  if(s.time){
    h+=`<div class="card" id="sec5"><div class="step"><span class="n">5</span>填寫資料</div>
    <label>姓名</label><input id="fName" value="${esc(s.name||S.name)}" autocomplete="name">
    <label>手機</label><input id="fPhone" type="tel" inputmode="numeric" placeholder="0912345678" value="${esc(s.phone||'')}" autocomplete="tel">
    ${s.type==='到府'?`<label>到府地址</label><input id="fAddr" value="${esc(s.address||'')}" placeholder="${esc(areaName(s.county,s.district))}…"><div class="note" style="margin-top:10px">到府服務需另加車馬費 車馬費可以在 LINE 預約圖文選單的「居家服務區域」查看</div>`:''}
    <label>備註 選填</label><textarea id="fNote" rows="2">${esc(s.note||'')}</textarea>
    <div class="card" style="margin:16px 0 0;background:var(--bg)">
      <div class="kv"><span>日期</span><span>${esc((S.dates.find(d=>d.date===s.date)||{}).label||s.date)}</span></div>
      <div class="kv"><span>時間</span><span>${s.time}</span></div>
      <div class="kv"><span>地點</span><span>${esc(s.type==='門市'?s.location:'到府 '+areaName(s.county,s.district))}</span></div>
    </div>
    <button class="btn" id="submit">確認預約</button></div>`;
  }
  return h;
}

function bindBook(){
  if(S.tab!=='book')return;
  document.querySelectorAll('[data-type]').forEach(el=>el.onclick=()=>{S.sel={type:el.dataset.type};S.dates=null;S.times=null;render();scrollTo('sec2');});
  document.querySelectorAll('[data-loc]').forEach(el=>el.onclick=()=>{S.sel={type:'門市',location:el.dataset.loc};loadDates();});
  document.querySelectorAll('[data-rg]').forEach(el=>el.onclick=()=>{S.sel={type:'到府',region:el.dataset.rg};S.dates=null;S.times=null;render();});
  document.querySelectorAll('[data-ad]').forEach(el=>el.onclick=()=>{S.sel={type:'到府',region:S.sel.region,county:el.dataset.ac,district:el.dataset.ad};loadDates();});
  document.querySelectorAll('[data-date]').forEach(el=>el.onclick=()=>{keepForm();S.sel.date=el.dataset.date;delete S.sel.time;const d=(S.dates||[]).find(x=>x.date===S.sel.date);if(d&&d.times){S.times=d.times;render();scrollTo('sec4');}else loadTimes();});
  document.querySelectorAll('[data-time]').forEach(el=>el.onclick=()=>{keepForm();S.sel.time=el.dataset.time;render();scrollTo('sec5');});
  if($('submit'))$('submit').onclick=submit;
  attachPhone('fPhone');
}
function keepForm(){
  if($('fName'))S.sel.name=$('fName').value;
  if($('fPhone'))S.sel.phone=$('fPhone').value;
  if($('fAddr'))S.sel.address=$('fAddr').value;
  if($('fNote'))S.sel.note=$('fNote').value;
}
function scrollTo(id){setTimeout(()=>{const el=$(id);if(el)el.scrollIntoView({behavior:'smooth',block:'start'});},50);}

async function loadDates(){
  S.dates=null;S.times=null;S.loading='dates';render();scrollTo('sec3');
  try{S.dates=await call('dates',q());}catch(e){toast(e.message);S.dates=[];}
  S.loading='';render();
}
async function loadTimes(){
  keepForm();S.times=null;S.loading='times';render();scrollTo('sec4');
  try{S.times=await call('slots',Object.assign(q(),{date:S.sel.date}));const d=(S.dates||[]).find(x=>x.date===S.sel.date);if(d)d.times=S.times;}catch(e){toast(e.message);S.times=[];}
  S.loading='';render();
}

async function submit(){
  keepForm();
  const s=S.sel;
  if(!String(s.name||'').trim())return toast('請填寫姓名');
  const ph=phoneHint(s.phone);
  if(!ph.ok){if($('fPhone'))$('fPhone').focus();return toast(ph.msg?(ph.msg.indexOf('手機')===0?ph.msg:'手機號碼'+ph.msg):'請填寫手機號碼');}
  s.phone=normPhone(s.phone);
  if(s.type==='到府'&&!String(s.address||'').trim())return toast('請填寫到府地址');
  const b=$('submit');b.disabled=true;b.textContent='送出中';
  try{
    const r=await call('book',Object.assign(q(),{date:s.date,time:s.time,name:s.name,phone:s.phone,address:s.address,note:s.note}));
    S.lastPhone=s.phone;
    renderDone(r);
  }catch(e){
    toast(e.message);b.disabled=false;b.textContent='確認預約';
    if(e.message.indexOf('約走')>=0){delete S.sel.time;loadTimes();}
  }
}

function renderDone(r){
  $('app').innerHTML=`<h1>預約成功</h1><div class="card">
  <div class="shot">請截圖保存此畫面</div>
  <div class="mute" style="text-align:center">你的預約碼</div><div class="big">${esc(r.code)}</div>
  <div class="when"><div class="wd">${esc(r.label)}</div><div class="wt">${r.start}–${r.end}</div></div>
  <div class="kv"><span>地點</span><span>${esc(r.place)}</span></div>
  ${r.address?`<div class="kv"><span>地址</span><span>${esc(r.address)}</span></div>`:''}
  ${r.teacher?`<div class="kv"><span>服務老師</span><span>${esc(r.teacher)} <a href="${TEAM_URL}" target="_blank" class="lnk">認識老師</a></span></div>`:''}
  ${r.type==='到府'?'<div class="note" style="margin-top:12px">到府服務需另加車馬費 車馬費可以在 LINE 預約圖文選單的「居家服務區域」查看</div>':''}
  <div class="remind">如有成功綁定 LINE 進行預約<br>可於春節 LINE 收到預約成功訊息<br>如無綁定 請加入<a href="${LINE_OA_URL}" target="_top" class="lnk">春節思庭官方 LINE</a><br>並傳送此畫面截圖<br>方便當天服務老師與您聯繫</div>
  <div class="mute" style="margin-top:10px;text-align:center">如需取消請在課程前 ${r.cancelHours} 小時以前操作</div>
  <a class="btn line" href="${LINE_OA_URL}" target="_top">回到 LINE</a></div>`;
}

/* ====== 我的預約 ====== */
function mineHtml(){
  let h='';
  if(S.mode==='guest'){
    h+=`<div class="card"><div class="step">查詢預約</div>
    <label>手機</label><input id="gPhone" type="tel" inputmode="numeric" value="${esc(S.guestQ?S.guestQ.phone:(S.lastPhone||''))}">
    <label>預約碼</label><input id="gCode" style="text-transform:uppercase" value="${esc(S.guestQ?S.guestQ.code:'')}">
    <button class="btn" id="gGo">查詢</button></div>`;
  }
  if(S.loading==='mine')return h+`<div class="card center mute">查詢中</div>`;
  if(S.mine){
    if(!S.mine.length)h+=`<div class="card center mute">目前沒有預約</div>`;
    S.mine.forEach(r=>{
      h+=`<div class="card">
      <div class="kv"><span>日期</span><span>${esc(r.label)}</span></div>
      <div class="kv"><span>時間</span><span>${r.start}–${r.end}</span></div>
      <div class="kv"><span>地點</span><span>${esc(r.place)}</span></div>
      ${r.address?`<div class="kv"><span>地址</span><span>${esc(r.address)}</span></div>`:''}
      ${r.teacher?`<div class="kv"><span>服務老師</span><span>${esc(r.teacher)}</span></div>`:''}
      <div class="kv"><span>預約碼</span><span>${esc(r.code)}</span></div>
      ${r.canCancel?`<button class="btn bad" data-cancel="${r.id}">取消預約</button>`:`<div class="mute" style="margin-top:10px">課程前 ${r.cancelHours} 小時內無法線上取消 如需異動請直接聯繫我們</div>`}
      </div>`;
    });
  }
  return h;
}
function bindMine(){
  if(S.tab!=='mine')return;
  attachPhone('gPhone');
  if($('gGo'))$('gGo').onclick=()=>{const ph=phoneHint($('gPhone').value);if(!ph.ok)return toast('請填寫正確的手機號碼');S.guestQ={phone:normPhone($('gPhone').value),code:$('gCode').value.trim().toUpperCase()};loadMine();};
  document.querySelectorAll('[data-cancel]').forEach(el=>el.onclick=async()=>{
    const r=S.mine.find(x=>x.id===el.dataset.cancel);
    if(!confirm(`確定取消 ${r.label} ${r.start} 的預約？`))return;
    el.disabled=true;
    try{await call('cancel',Object.assign({id:r.id},S.mode==='guest'?S.guestQ:{}));toast('已取消');loadMine();}
    catch(e){toast(e.message);el.disabled=false;}
  });
}
async function loadMine(){
  S.loading='mine';render();
  try{S.mine=await call('mine',S.mode==='guest'?S.guestQ:{});}catch(e){toast(e.message);S.mine=null;}
  S.loading='';render();
}

/* ====== 老師綁定 LINE ====== */
function renderBind(){
  $('app').innerHTML=`<h1>老師綁定 LINE 通知</h1><div class="card">
  <div class="mute">綁定後 新預約和取消會推播到這個 LINE</div>
  <label>員工編號</label><input id="bId"><label>密碼</label><input id="bPw" type="password">
  <button class="btn" id="bGo">綁定</button></div>`;
  $('bGo').onclick=async()=>{
    const b=$('bGo');b.disabled=true;
    try{const r=await call('bind',{empId:$('bId').value,pw:$('bPw').value});renderMsg(`${r.name} 綁定完成 之後會在這裡收到預約通知`);}
    catch(e){toast(e.message);b.disabled=false;}
  };
}

boot();
</script>
</body>
</html>
